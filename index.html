    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      padding:32px 16px; background:
        radial-gradient(ellipse at 50% 0%, #252525 0%, transparent 48%),
        var(--bg); color:var(--text); font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .wrap { width:min(100%, 440px); text-align:center; }
    .mark {

      display:grid; place-items:center; font-size:27px; font-weight:800; letter-spacing:-2px;

    .eyebrow { color:#bdbdbd; font-size:11px; letter-spacing:.28em; text-transform:uppercase; }
    h1 { margin:9px 0 7px; font-size:clamp(28px,7vw,38px); letter-spacing:.08em; font-weight:800; }
    .subtitle { color:var(--muted); margin:0 auto 28px; font-size:14px; }
    .links { display:grid; gap:11px; }
    .link {
      display:flex; align-items:center; justify-content:space-between; gap:14px; padding:16px 18px;
      border:1px solid var(--line); border-radius:13px; background:linear-gradient(110deg,#151515,#0d0d0d);
      color:var(--text); text-decoration:none; text-align:left; transition:transform .16s ease,border-color .16s ease,background .16s ease;
    }
    .link:hover, .link:focus-visible { transform:translateY(-2px); border-color:#777; background:#191919; outline:none; }
    .left { display:flex; align-items:center; gap:13px; }
    .icon { width:36px; height:36px; display:grid; place-items:center; border-radius:10px; border:1px solid #333; background:#202020; font-size:12px; font-weight:800; letter-spacing:.02em; }
    .label { display:block; font-weight:650; font-size:15px; }
    .handle { display:block; color:var(--muted); font-size:12px; margin-top:3px; }
    .arrow { color:#888; font-size:20px; }
    footer { margin-top:27px; color:#6f6f6f; font-size:10px; letter-spacing:.22em; }
    .note { color:#777; font-size:11px; line-height:1.5; margin-top:16px; }
    @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
